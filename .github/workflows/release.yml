name: Release

# Fires only on version tags (v1.0.0, v1.1.0, ...). Builds the minified APK signed
# with the REAL release key (GitHub Secrets) and publishes it, together with the R8
# mapping, as a GitHub Release. Per-push testing builds stay in android-ci.yml.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    name: Signed release build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Same gate as CI: a red suite must never become a published release.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Decode release keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # Gradle picks up ORG_GRADLE_PROJECT_<name> env vars as project properties —
      # same names the signingConfig reads locally, and nothing secret on the
      # command line or in the logs.
      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease
        env:
          ORG_GRADLE_PROJECT_TSTEPS_KEYSTORE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_TSTEPS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_TSTEPS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_TSTEPS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Name the artifacts after the tag: the mapping must stay forever paired with
      # the exact APK it deobfuscates.
      - name: Rename artifacts after the tag
        run: |
          cp app/build/outputs/apk/release/app-release.apk "tsteps-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "mapping-${GITHUB_REF_NAME}.txt"

      # The body of the release is the CHANGELOG section for this tag, so the page
      # says what changed in the reader's terms instead of only listing commits;
      # GitHub's generated notes are appended under it by the action. Matched as a
      # literal prefix, not a regex, or the dots in the version would match anything.
      # A tag with no section falls back to the generated notes rather than failing
      # the release: the artifacts matter more than the prose.
      - name: Take the release body from CHANGELOG.md
        run: |
          awk -v pfx="## [${GITHUB_REF_NAME#v}]" '
            index($0, pfx) == 1        { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found && /^\[[^]]+\]: /         { exit }
            found                      { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section for ${GITHUB_REF_NAME}; using the generated notes alone."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            tsteps-${{ github.ref_name }}.apk
            mapping-${{ github.ref_name }}.txt
          generate_release_notes: true
